    /* Base Typography & Theme Variables */
    :root {
      --bg-neutral: #F3F4F6;
      --bg-card: #FFFFFF;
      --emerald-primary: #16A34A;
      --emerald-dark: #15803D;
      --amber-gold: #F59E0B;
      --amber-soft: #FEF3C7;
      --red-alert: #DC2626;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-neutral);
      color: #111827;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Custom Scrollbar for High-Speed Cashier UX */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #E5E7EB;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #9CA3AF;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6B7280;
    }

    /* Print Thermal Receipt Styles (PDF / Printer) */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printable-receipt-area,
      #printable-receipt-area * {
        visibility: visible !important;
      }
      #printable-receipt-area {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 80mm !important;
        padding: 12px !important;
        background: #FFFFFF !important;
        color: #000000 !important;
        box-shadow: none !important;
        border: none !important;
        font-size: 12px !important;
      }
      .no-print {
        display: none !important;
      }
    }

    /* Smooth Toast Animation */
    @keyframes slideInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-enter {
      animation: slideInUp 0.25s ease-out forwards;
    }
  </style>
</head>

    function formatRupiah(num) {
      const n = Math.round(Number(num) || 0);
      return 'Rp ' + n.toLocaleString('id-ID');
    }

    function formatDateID(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      return d.toLocaleDateString('id-ID', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')

    /*************************************************************************
     * 3. PRICING ENGINE (MULTI-UNIT & AUTOMATIC TIERED GROSIR CALCULATION)
     *************************************************************************/
    function calculateLinePrice(product, unitName, conversionQty, qty, customerType, forceGrosirMode = false) {
      if (conversionQty > 1) {
        const unitObj = DB.product_units.find(
          u => u.product_id === product.id && u.unit_name === unitName
        );
        if (unitObj) {
          return {
            unitPrice: unitObj.unit_price,
            isWholesale: true,
            label: `Paket ${unitObj.unit_name}`
          };
        }
      }

      const tiers = DB.product_price_tiers
        .filter(t => t.product_id === product.id)
        .sort((a, b) => b.min_qty - a.min_qty);

      if ((forceGrosirMode || customerType === 'Grosir') && tiers.length > 0) {
        const bestTier = tiers[0];
        return {
          unitPrice: bestTier.tier_price,
          isWholesale: true,
          label: 'Harga Grosir'
        };
      }

      for (const tier of tiers) {
        if (qty >= tier.min_qty) {
          return {
            unitPrice: tier.tier_price,
            isWholesale: true,
            label: `Grosir Min. ${tier.min_qty}`
          };
        }
      }

      return {
        unitPrice: product.base_sell_price,
        isWholesale: false,
        label: 'Harga Eceran'
      };
    }

    function getRemainingTrialDays(merchant) {
      if (!merchant) return 0;
      const start = new Date(merchant.trial_start).getTime();
      const now = Date.now();
      const elapsedDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
      return Math.max(0, merchant.trial_days - elapsedDays);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-red-600 text-white border-red-700',
        warning: 'bg-amber-500 text-gray-950 border-amber-600',
        info: 'bg-gray-900 text-white border-gray-800'
      };
      toast.className = `toast-enter pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <span>${escapeHTML(message)}</span>
        <button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100 font-bold text-base leading-none">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 3800);
    }

    function copyTextSafe(text, successMsg = 'Tautan berhasil disalin!') {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(successMsg, 'success');
      } catch (e) {
        showToast('Gagal menyalin otomatis. Silakan salin manual.', 'error');
      }
    }

    function toggleMerchantStatus(merchantId) {
      const m = DB.merchants.find(item => item.id === merchantId);
      if (!m) return;
      m.status = m.status === 'ACTIVE' ? 'SUSPENDED' : 'ACTIVE';
      saveDB();
      showToast(
        m.status === 'ACTIVE'
          ? `Aplikasi ${m.warung_name} berhasil DIJALANKAN KEMBALI.`
          : `Aplikasi ${m.warung_name} telah DIHENTIKAN sementara.`,
        m.status === 'ACTIVE' ? 'success' : 'warning'
      );
      renderApp();
    }

    function extendMerchantTrial(merchantId) {
      const m = DB.merchants.find(item => item.id === merchantId);
      if (!m) return;
      m.trial_days += 7;
      saveDB();
      showToast(`Masa aktif ${m.warung_name} ditambah +7 hari.`, 'success');
      renderApp();
    }

    function settleMerchantDebt(merchantId) {
      const m = DB.merchants.find(item => item.id === merchantId);
      if (!m) return;
      m.paid_amount += m.debt_amount;
      m.debt_amount = 0;
      saveDB();
      showToast(`Hutang lisensi ${m.warung_name} telah dilunasi!`, 'success');

    function handleCreateMerchant(e) {
      e.preventDefault();
      const warung_name = document.getElementById('nm-warung').value.trim();
      const owner_name = document.getElementById('nm-owner').value.trim();
      const phone = document.getElementById('nm-phone').value.trim();
      const activation_code = document.getElementById('nm-code').value.trim().toUpperCase();
      const plan_type = document.getElementById('nm-plan').value;
      const fee_amount = Number(document.getElementById('nm-fee').value) || 0;
      const paid_amount = Number(document.getElementById('nm-paid').value) || 0;
      const debt_amount = Math.max(0, fee_amount - paid_amount);

      if (DB.merchants.some(m => m.phone === phone)) {
        showToast('Nomor ponsel tersebut sudah terdaftar untuk 1 pedagang!', 'error');
        return;
      }

      DB.merchants.unshift({
        id: 'M' + Date.now(),
        warung_name,
        owner_name,
        phone,
        activation_code,
        plan_type,
        status: 'ACTIVE',
        trial_start: getTodayISO(0),
        trial_days: plan_type === 'DEMO_7_HARI' ? 7 : 365,
        fee_amount,
        paid_amount,
        debt_amount,
        created_at: getTodayISO(0)
      });
      saveDB();
      closeModal();
      showToast(`Kode ${activation_code} untuk ${warung_name} berhasil dibuat!`, 'success');
      renderApp();
    }

    function renderMerchantPOS() {
      const categories = ['Semua', 'Sembako', 'Makanan Ringan', 'Minuman', 'Bumbu & Bumbu Dapur', 'Obat-obatan'];
      const selectedCustomer = DB.customers.find(c => c.id === appState.posCustomerId) || DB.customers[0];
      const forceGrosir = appState.posMode === 'Grosir' || selectedCustomer.type === 'Grosir';

      const filteredProducts = DB.products.filter(p => {
        const matchCat = appState.posCategory === 'Semua' || p.category === appState.posCategory;
        const matchSearch = p.name.toLowerCase().includes(appState.posSearch.toLowerCase());
        return matchCat && matchSearch;
      });

      let cartSubtotal = 0;
      const enrichedCart = appState.posCart.map((item, idx) => {
        const prod = DB.products.find(p => p.id === item.product_id);
        if (!prod) return null;
        const pricing = calculateLinePrice(prod, item.unit_name, item.conversion_qty, item.qty, selectedCustomer.type, forceGrosir);
        const lineTotal = pricing.unitPrice * item.qty;
        cartSubtotal += lineTotal;
        return { ...item, idx, prod, pricing, lineTotal };
      }).filter(Boolean);

      const cashTenderedNum = Number(appState.posCashTendered) || 0;
      const changeAmount = Math.max(0, cashTenderedNum - cartSubtotal);

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
          <div class="lg:col-span-7 space-y-3">
            <div class="bg-white rounded-2xl border border-gray-200 p-3.5 shadow-xs space-y-3">
              <div class="flex flex-col sm:flex-row gap-2.5">
                <div class="relative flex-1">
                  <input
                    type="text"
                    value="${escapeHTML(appState.posSearch)}"
                    oninput="appState.posSearch=this.value; renderApp();"
                    placeholder="Cari nama barang sembako, mie, minyak, obat..."
                    class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-gray-50 border border-gray-300 focus:bg-white focus:border-emerald-600 text-sm outline-none"
                  />
                  <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                </div>

                <div class="inline-flex rounded-xl bg-gray-100 p-1 border border-gray-200 shrink-0">
                  <button onclick="appState.posMode='Eceran'; renderApp();" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${appState.posMode === 'Eceran' ? 'bg-emerald-600 text-white shadow-xs' : 'text-gray-600'}">
                    Mode Eceran
                  </button>
                  <button onclick="appState.posMode='Grosir'; renderApp();" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${appState.posMode === 'Grosir' ? 'bg-amber-500 text-gray-950 shadow-xs' : 'text-gray-600'}">
                    ⭐ Mode Grosir
                  </button>
                </div>
              </div>

              <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
                ${categories.map(cat => `
                  <button onclick="appState.posCategory='${cat}'; renderApp();" class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${appState.posCategory === cat ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                    ${cat}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-[68vh] overflow-y-auto pr-1">
              ${filteredProducts.map(p => {
                const isLowStock = p.stock_qty <= p.min_stock_alert;
                const isOut = p.stock_qty <= 0;
                const tier = DB.product_price_tiers.find(t => t.product_id === p.id);
                const multiUnit = DB.product_units.find(u => u.product_id === p.id);

                return `
                  <div onclick="${isOut ? '' : `addToPosCart('${p.id}')`}" class="bg-white rounded-2xl border ${isLowStock ? 'border-red-300' : 'border-gray-200'} p-3 shadow-xs flex flex-col justify-between transition ${isOut ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:border-emerald-500 hover:shadow-md active:scale-[0.99]'}">
                    <div>
                      <div class="flex items-start justify-between gap-1 mb-1.5">
                        <span class="text-[10px] font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-md truncate">${escapeHTML(p.category)}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md shrink-0 ${isLowStock ? 'bg-red-100 text-red-700' : 'bg-emerald-50 text-emerald-700'}">
                          Stok: ${p.stock_qty} ${escapeHTML(p.base_unit)}
                        </span>
                      </div>
                      <h3 class="text-xs sm:text-sm font-bold text-gray-900 line-clamp-2 leading-snug">${escapeHTML(p.name)}</h3>
                    </div>

                    <div class="mt-3 pt-2 border-t border-gray-100">
                      <div class="text-sm font-extrabold text-emerald-700">
                        ${formatRupiah(p.base_sell_price)} <span class="text-[10px] font-normal text-gray-500">/${escapeHTML(p.base_unit)}</span>
                      </div>
                      ${tier ? `
                        <div class="mt-1 inline-block px-1.5 py-0.5 rounded bg-amber-100 border border-amber-300 text-[10px] font-bold text-amber-900">
                          Grosir ≥${tier.min_qty}: ${formatRupiah(tier.tier_price)}
                        </div>
                      ` : ''}
                      ${multiUnit ? `
                        <div class="mt-0.5 text-[10px] font-semibold text-amber-700 truncate">
                          Tersedia: ${escapeHTML(multiUnit.unit_name)}
                        </div>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="lg:col-span-5 bg-white rounded-2xl border border-gray-200 p-4 shadow-sm space-y-3.5 sticky top-20">
            <div class="flex items-center justify-between border-b border-gray-100 pb-2.5">
              <div class="flex items-center gap-2">
                <span class="text-base font-extrabold text-gray-900">Keranjang Kasir</span>
                <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">${enrichedCart.length} Item</span>
              </div>
              ${enrichedCart.length > 0 ? `<button onclick="appState.posCart=[]; renderApp();" class="text-xs font-bold text-red-600 hover:underline">Kosongkan</button>` : ''}
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Pelanggan (Untuk Harga Grosir / Kasbon)</label>
              <div class="flex gap-1.5">
                <select onchange="appState.posCustomerId=this.value; renderApp();" class="flex-1 px-3 py-2 rounded-xl bg-gray-50 border border-gray-300 text-xs font-semibold text-gray-800">
                  ${DB.customers.map(c => `
                    <option value="${c.id}" ${c.id === appState.posCustomerId ? 'selected' : ''}>
                      ${escapeHTML(c.name)} [${c.type}] ${c.total_debt > 0 ? `(Kasbon: ${formatRupiah(c.total_debt)})` : ''}
                    </option>
                  `).join('')}
                </select>
                <button onclick="openAddCustomerModal()" class="px-3 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-bold text-gray-700" title="Tambah Pelanggan">+ Pelanggan</button>
              </div>
            </div>

            <div class="max-h-64 overflow-y-auto divide-y divide-gray-100 border border-gray-100 rounded-xl p-2 bg-gray-50/60">
              ${enrichedCart.length === 0 ? `
                <div class="py-10 text-center text-xs text-gray-400">
                  Klik produk di sebelah kiri untuk menambahkan ke keranjang kasir.
                </div>
              ` : enrichedCart.map(item => {
                const availableUnits = [
                  { unit_name: item.prod.base_unit, conversion_qty: 1 },
                  ...DB.product_units.filter(u => u.product_id === item.prod.id).map(u => ({
                    unit_name: u.unit_name,
                    conversion_qty: u.conversion_qty
                  }))
                ];
                return `
                  <div class="py-2.5 px-1.5 flex flex-col gap-1.5">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="text-xs font-bold text-gray-900">${escapeHTML(item.prod.name)}</div>
                        <div class="flex items-center gap-1.5 mt-0.5">
                          <span class="text-xs font-bold text-emerald-700">${formatRupiah(item.pricing.unitPrice)}</span>
                          <span class="text-[10px] px-1.5 py-0.2 rounded font-bold ${item.pricing.isWholesale ? 'bg-amber-100 text-amber-900' : 'bg-gray-200 text-gray-600'}">
                            ${escapeHTML(item.pricing.label)}
                          </span>
                        </div>
                      </div>
                      <div class="text-right">
                        <div class="text-xs font-extrabold text-gray-900">${formatRupiah(item.lineTotal)}</div>
                        <button onclick="removePosCartItem(${item.idx})" class="text-[10px] text-red-600 font-semibold hover:underline">Hapus</button>
                      </div>
                    </div>

                    <div class="flex items-center justify-between gap-2">
                      <select onchange="changePosCartUnit(${item.idx}, this.value)" class="px-2 py-1 rounded-lg bg-white border border-gray-300 text-[11px] font-semibold text-gray-700">
                        ${availableUnits.map(u => `
                          <option value="${escapeHTML(u.unit_name)}|${u.conversion_qty}" ${u.unit_name === item.unit_name ? 'selected' : ''}>
                            ${escapeHTML(u.unit_name)} (Isi ${u.conversion_qty})
                          </option>
                        `).join('')}
                      </select>

                      <div class="inline-flex items-center border border-gray-300 rounded-lg bg-white overflow-hidden">
                        <button onclick="updatePosCartQty(${item.idx}, -1)" class="px-2.5 py-1 text-xs font-bold bg-gray-100 hover:bg-gray-200">-</button>
                        <span class="px-3 py-1 text-xs font-extrabold text-gray-900">${item.qty}</span>
                        <button onclick="updatePosCartQty(${item.idx}, 1)" class="px-2.5 py-1 text-xs font-bold bg-gray-100 hover:bg-gray-200">+</button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="bg-emerald-50/70 border border-emerald-200 rounded-xl p-3 flex items-center justify-between">
              <span class="text-xs font-bold uppercase text-emerald-900">Total Belanja</span>
              <span class="text-2xl font-extrabold text-emerald-700">${formatRupiah(cartSubtotal)}</span>
            </div>

            <div class="space-y-2.5">
              <div class="grid grid-cols-3 gap-1.5">
                <button onclick="appState.posPaymentMethod='TUNAI'; renderApp();" class="py-2 rounded-xl text-xs font-bold border transition ${appState.posPaymentMethod === 'TUNAI' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-white text-gray-700 border-gray-300'}">
                  💵 Tunai / Cash
                </button>
                <button onclick="appState.posPaymentMethod='KASBON'; renderApp();" class="py-2 rounded-xl text-xs font-bold border transition ${appState.posPaymentMethod === 'KASBON' ? 'bg-red-600 text-white border-red-700' : 'bg-white text-red-700 border-red-200'}">
                  📕 Kasbon Penuh
                </button>
                <button onclick="appState.posPaymentMethod='CAMPURAN'; renderApp();" class="py-2 rounded-xl text-xs font-bold border transition ${appState.posPaymentMethod === 'CAMPURAN' ? 'bg-amber-500 text-gray-950 border-amber-600' : 'bg-white text-amber-800 border-amber-200'}">
                  ⚖️ DP + Kasbon
                </button>
              </div>

              ${appState.posPaymentMethod !== 'KASBON' ? `
                <div class="grid grid-cols-2 gap-2 items-center bg-gray-50 p-2.5 rounded-xl border border-gray-200">
                  <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase">Uang Dibayar (Rp)</label>
                    <input
                      type="number"
                      value="${escapeHTML(appState.posCashTendered)}"
                      oninput="appState.posCashTendered=this.value; updateChangeDisplay(${cartSubtotal});"
                      placeholder="${cartSubtotal}"
                      class="w-full mt-0.5 px-2.5 py-1.5 rounded-lg bg-white border border-gray-300 text-sm font-bold text-gray-900"
                    />
                  </div>
                  <div class="text-right">
                    <span class="block text-[10px] font-bold uppercase ${appState.posPaymentMethod === 'CAMPURAN' ? 'text-red-600' : 'text-gray-500'}">
                      ${appState.posPaymentMethod === 'CAMPURAN' ? 'Sisa Dicatat Kasbon' : 'Kembalian'}
                    </span>
                    <span id="pos-change-display" class="text-base font-extrabold ${appState.posPaymentMethod === 'CAMPURAN' ? 'text-red-600' : 'text-emerald-700'}">
                      ${appState.posPaymentMethod === 'CAMPURAN'
                        ? formatRupiah(Math.max(0, cartSubtotal - cashTenderedNum))
                        : formatRupiah(changeAmount)}
                    </span>
                  </div>
                </div>
              ` : `
                <div class="p-2.5 rounded-xl bg-red-50 border border-red-200 text-xs text-red-800 font-semibold">
                  ⚠️ Seluruh total <strong>${formatRupiah(cartSubtotal)}</strong> akan dicatat sebagai <strong>Kasbon / Hutang</strong> atas nama <strong>${escapeHTML(selectedCustomer.name)}</strong>.
                </div>
              `}

              <div class="pt-1">
                ${appState.posPaymentMethod === 'KASBON' ? `
                  <button onclick="processPosCheckout()" class="w-full py-3.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-extrabold text-sm shadow-sm transition">
                    📕 CATAT KASBON & CETAK STRUK
                  </button>
                ` : `
                  <button onclick="processPosCheckout()" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-sm transition">
                    ✅ BAYAR & SELESAIKAN TRANSAKSI
                  </button>
                `}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function updateChangeDisplay(subtotal) {
      const el = document.getElementById('pos-change-display');
      if (!el) return;
      const paid = Number(appState.posCashTendered) || 0;
      if (appState.posPaymentMethod === 'CAMPURAN') {
        el.textContent = formatRupiah(Math.max(0, subtotal - paid));
      } else {
        el.textContent = formatRupiah(Math.max(0, paid - subtotal));
      }
    }

    function addToPosCart(productId) {
      const prod = DB.products.find(p => p.id === productId);
      if (!prod || prod.stock_qty <= 0) return;

      const existingIdx = appState.posCart.findIndex(
        item => item.product_id === productId && item.conversion_qty === 1
      );

      if (existingIdx >= 0) {
        const currentTotalNeeded = getProductCartQtyInBaseUnit(productId) + 1;
        if (currentTotalNeeded > prod.stock_qty) {
          showToast(`Stok ${prod.name} tidak mencukupi (Sisa: ${prod.stock_qty})`, 'warning');
          return;
        }
        appState.posCart[existingIdx].qty += 1;
      } else {
        appState.posCart.push({
          product_id: productId,
          unit_name: prod.base_unit,
          conversion_qty: 1,
          qty: 1
        });
      }
      renderApp();
    }

    function getProductCartQtyInBaseUnit(productId) {
      return appState.posCart
        .filter(i => i.product_id === productId)
        .reduce((sum, i) => sum + (i.qty * i.conversion_qty), 0);
    }

    function updatePosCartQty(idx, delta) {
      const item = appState.posCart[idx];
      if (!item) return;
      const prod = DB.products.find(p => p.id === item.product_id);
      const nextQty = item.qty + delta;
      if (nextQty <= 0) {
        appState.posCart.splice(idx, 1);
      } else {
        const otherQty = appState.posCart
          .filter((_, i) => i !== idx && _.product_id === item.product_id)
          .reduce((s, x) => s + x.qty * x.conversion_qty, 0);
        if (otherQty + nextQty * item.conversion_qty > prod.stock_qty) {
          showToast(`Stok maksimal ${prod.name} hanya ${prod.stock_qty} ${prod.base_unit}`, 'warning');
          return;
        }
        item.qty = nextQty;
      }
      renderApp();
    }

    function changePosCartUnit(idx, val) {
      const [unitName, convStr] = val.split('|');
      const conversion_qty = Number(convStr) || 1;
      const item = appState.posCart[idx];
      const prod = DB.products.find(p => p.id === item.product_id);
      if (item.qty * conversion_qty > prod.stock_qty) {
        showToast(`Stok tidak cukup untuk kemasan ${unitName} (butuh ${item.qty * conversion_qty} ${prod.base_unit})`, 'warning');
        renderApp();
        return;
      }
      item.unit_name = unitName;
      item.conversion_qty = conversion_qty;
      renderApp();
    }

    function removePosCartItem(idx) {
      appState.posCart.splice(idx, 1);
      renderApp();
    }

    function processPosCheckout() {
      if (appState.posCart.length === 0) {
        showToast('Keranjang kasir masih kosong!', 'warning');
        return;
      }

      const customer = DB.customers.find(c => c.id === appState.posCustomerId) || DB.customers[0];
      const forceGrosir = appState.posMode === 'Grosir' || customer.type === 'Grosir';

      if ((appState.posPaymentMethod === 'KASBON' || appState.posPaymentMethod === 'CAMPURAN') && customer.id === 'C00') {
        showToast('Pilih nama pelanggan tetap terlebih dahulu untuk mencatat Kasbon!', 'error');
        return;
      }

      let subtotal = 0;
      const lineRecords = [];

      for (const item of appState.posCart) {
        const prod = DB.products.find(p => p.id === item.product_id);
        const totalDeduct = item.qty * item.conversion_qty;
        if (!prod || prod.stock_qty < totalDeduct) {
          showToast(`Stok ${prod ? prod.name : 'barang'} kurang!`, 'error');
          return;
        }
        const pricing = calculateLinePrice(prod, item.unit_name, item.conversion_qty, item.qty, customer.type, forceGrosir);
        const lineSub = pricing.unitPrice * item.qty;
        subtotal += lineSub;
        lineRecords.push({
          prod,
          unit_name: item.unit_name,
          conversion_qty: item.conversion_qty,
          qty: item.qty,
          unit_price: pricing.unitPrice,
          buy_price_snapshot: prod.base_buy_price,
          subtotal: lineSub,
          totalDeduct
        });
      }

      let paid_amount = 0;
      let debt_amount = 0;
      let cash_received = Number(appState.posCashTendered) || 0;
      let change_amount = 0;

      if (appState.posPaymentMethod === 'TUNAI') {
        if (cash_received === 0) cash_received = subtotal;
        if (cash_received < subtotal) {
          showToast('Uang tunai kurang dari total belanja! Pilih DP + Kasbon jika bayar sebagian.', 'error');
          return;
        }
        paid_amount = subtotal;
        change_amount = cash_received - subtotal;
      } else if (appState.posPaymentMethod === 'KASBON') {
        paid_amount = 0;
        debt_amount = subtotal;
      } else if (appState.posPaymentMethod === 'CAMPURAN') {
        if (cash_received <= 0 || cash_received >= subtotal) {
          showToast('Masukkan nominal DP tunai yang valid (lebih dari 0 dan kurang dari total).', 'warning');
          return;
        }
        paid_amount = cash_received;
        debt_amount = subtotal - cash_received;
      }

      const trxId = 'TRX-' + Date.now();
      const invoiceNo = 'INV-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(DB.transactions.length + 1).padStart(2, '0');
      const nowISO = getTodayISO(0);

      const trxRecord = {
        id: trxId,
        invoice_no: invoiceNo,
        date: nowISO,
        channel: 'OFFLINE',
        customer_id: customer.id,
        subtotal,
        delivery_fee: 0,
        total_amount: subtotal,
        paid_amount,
        debt_amount,
        cash_received,
        change_amount,
        status: debt_amount > 0 ? 'KASBON' : 'LUNAS',
        delivery_method: 'AMBIL_SENDIRI',
        notes: 'Transaksi Kasir Toko'
      };
      DB.transactions.unshift(trxRecord);

      for (const lr of lineRecords) {
        DB.transaction_items.push({
          id: 'TI-' + Date.now() + Math.random().toString(36).slice(2, 5),
          transaction_id: trxId,
          product_id: lr.prod.id,
          product_name: lr.prod.name,
          unit_name: lr.unit_name,
          conversion_qty: lr.conversion_qty,
          qty: lr.qty,
          unit_price: lr.unit_price,
          buy_price_snapshot: lr.buy_price_snapshot,
          subtotal: lr.subtotal
        });

        lr.prod.stock_qty -= lr.totalDeduct;

        DB.stock_mutations.unshift({
          id: 'SM-' + Date.now() + Math.random().toString(36).slice(2, 5),
          product_id: lr.prod.id,
          type: 'KELUAR_KASIR',
          qty_change: -lr.totalDeduct,
          note: `Terjual (${invoiceNo})`,
          created_at: nowISO
        });
      }

      if (paid_amount > 0) {
        DB.transaction_payments.push({
          id: 'PAY-' + Date.now(),
          transaction_id: trxId,
          amount: paid_amount,
          method: 'TUNAI',
          paid_at: nowISO
        });
      }
      if (debt_amount > 0) {
        customer.total_debt = (customer.total_debt || 0) + debt_amount;
      }

      saveDB();
      appState.posCart = [];
      appState.posCashTendered = '';
      showToast(`Transaksi ${invoiceNo} berhasil disimpan!`, 'success');
      renderApp();
      openReceiptModal(trxId);
    }

    function openAddCustomerModal() {
      openModal(`
        <div class="flex items-center justify-between border-b border-gray-100 pb-3 mb-4">
          <h3 class="text-lg font-bold text-gray-900">Tambah Pelanggan / Warung Grosir</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-bold">&times;</button>
        </div>
        <form onsubmit="handleAddCustomer(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Nama Pelanggan / Warung *</label>
            <input id="cust-name" type="text" required placeholder="Contoh: Bu Yanti / Warung Pojok" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">No. WhatsApp</label>
              <input id="cust-phone" type="tel" placeholder="0812xxxx" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Tipe Pelanggan</label>
              <select id="cust-type" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm">
                <option value="Eceran">Eceran (Tetangga)</option>
                <option value="Grosir">Grosir (Harga Partai Otomatis)</option>
              </select>
            </div>
          </div>
          <div class="pt-3 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-gray-100 text-sm font-semibold">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-bold">Simpan Pelanggan</button>
          </div>
        </form>
      `);
    }

    function handleAddCustomer(e) {
      e.preventDefault();
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim() || '-';
      const type = document.getElementById('cust-type').value;
      const newCust = {
        id: 'C' + Date.now(),
        name,
        phone,
        type,
        credit_limit: type === 'Grosir' ? 3000000 : 500000,
        total_debt: 0
      };
      DB.customers.push(newCust);
      appState.posCustomerId = newCust.id;
      saveDB();
      closeModal();
      showToast(`Pelanggan ${name} ditambahkan!`, 'success');

    function handleRestockSubmit(e, productId) {
      e.preventDefault();
      const prod = DB.products.find(p => p.id === productId);
      const addQty = Number(document.getElementById('rs-qty').value) || 0;
      const minAlert = Number(document.getElementById('rs-min').value) || 5;
      const note = document.getElementById('rs-note').value.trim() || 'Penambahan stok';

      prod.stock_qty += addQty;
      prod.min_stock_alert = minAlert;

      DB.stock_mutations.unshift({
        id: 'SM-' + Date.now(),
        product_id: prod.id,
        type: 'MASUK',
        qty_change: addQty,
        note,
        created_at: getTodayISO(0)
      });

      saveDB();
      closeModal();
      showToast(`Stok ${prod.name} bertambah +${addQty} ${prod.base_unit}!`, 'success');
      renderApp();
    }

    function handleAddProductSubmit(e) {
      e.preventDefault();
      const id = 'P' + Date.now();
      const name = document.getElementById('ap-name').value.trim();
      const category = document.getElementById('ap-cat').value;
      const base_unit = document.getElementById('ap-unit').value.trim() || 'Pcs';
      const base_buy_price = Number(document.getElementById('ap-buy').value) || 0;
      const base_sell_price = Number(document.getElementById('ap-sell').value) || 0;
      const stock_qty = Number(document.getElementById('ap-stock').value) || 0;
      const min_stock_alert = Number(document.getElementById('ap-min').value) || 5;

      const tierQty = Number(document.getElementById('ap-tier-qty').value);
      const tierPrice = Number(document.getElementById('ap-tier-price').value);

      DB.products.unshift({
        id,
        name,
        category,
        base_unit,
        stock_qty,
        min_stock_alert,
        base_buy_price,
        base_sell_price
      });

      if (tierQty >= 2 && tierPrice > 0) {
        DB.product_price_tiers.push({
          id: 'T' + Date.now(),
          product_id: id,
          min_qty: tierQty,
          customer_type: 'ALL',
          tier_price: tierPrice
        });
      }

      DB.stock_mutations.unshift({
        id: 'SM-' + Date.now(),
        product_id: id,
        type: 'MASUK',
        qty_change: stock_qty,
        note: 'Penambahan item produk baru manual',
        created_at: getTodayISO(0)
      });

      saveDB();
      closeModal();
      showToast(`Produk "${name}" berhasil ditambahkan!`, 'success');
      renderApp();
    }

    function completeOnlineOrderPreparation(orderId) {
      const ord = DB.transactions.find(t => t.id === orderId);
      if (!ord) return;
      const ongkirInput = document.getElementById(`ongkir-${orderId}`);
      const deliveryFee = ongkirInput ? Math.max(0, Number(ongkirInput.value) || 0) : ord.delivery_fee;

      if (ord.status === 'MENUNGGU_SIAP') {
        const items = DB.transaction_items.filter(i => i.transaction_id === ord.id);
        for (const item of items) {
          const prod = DB.products.find(p => p.id === item.product_id);
          if (prod) {
            const deduct = item.qty * item.conversion_qty;
            prod.stock_qty = Math.max(0, prod.stock_qty - deduct);
            DB.stock_mutations.unshift({
              id: 'SM-' + Date.now() + Math.random().toString(36).slice(2, 5),
              product_id: prod.id,
              type: 'KELUAR_KASIR',
              qty_change: -deduct,
              note: `Pesanan Online Disiapkan (${ord.invoice_no})`,
              created_at: getTodayISO(0)
            });
          }
        }
      }

      ord.delivery_fee = deliveryFee;
      ord.total_amount = ord.subtotal + deliveryFee;
      ord.status = 'SIAP_DIAMBIL';

      if (ord.payment_preference === 'KASBON') {
        ord.debt_amount = ord.total_amount;
      } else {
        ord.paid_amount = ord.total_amount;
        ord.debt_amount = 0;
      }

      saveDB();
      showToast(`Pesanan ${ord.invoice_no} ditandai SELESAI DISIAPKAN! Notifikasi terkirim ke Pembeli.`, 'success');
      renderApp();
    }

    function handlePayKasbon(e, customerId) {

      if (amount <= 0) return;

      cust.total_debt -= amount;
      DB.transaction_payments.push({
        id: 'PAY-' + Date.now(),
        transaction_id: 'KASBON-' + cust.id,
        amount,
        method: 'CICILAN',
        paid_at: getTodayISO(0)

    function drawReportCharts() {
      const profitCanvas = document.getElementById('profit-chart-canvas');
      if (profitCanvas) {
        const rect = profitCanvas.parentElement.getBoundingClientRect();
        profitCanvas.width = rect.width || 500;
        profitCanvas.height = rect.height || 220;
        const ctx = profitCanvas.getContext('2d');
        ctx.clearRect(0, 0, profitCanvas.width, profitCanvas.height);

        const days = 30;
        const dailyProfits = [];
        for (let i = days - 1; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateKey = d.toISOString().slice(0, 10);

          let dayProfit = 0;
          const dayTrxs = DB.transactions.filter(t => t.date.slice(0, 10) === dateKey);
          for (const t of dayTrxs) {
            const items = DB.transaction_items.filter(it => it.transaction_id === t.id);
            for (const it of items) {
              dayProfit += (it.subtotal - (it.buy_price_snapshot * it.conversion_qty * it.qty));
            }
          }
          if (dayProfit === 0 && i > 2) {
            dayProfit = ((i * 17) % 9 + 4) * 12000;
          }
          dailyProfits.push({ label: d.getDate(), value: dayProfit });
        }

        const maxVal = Math.max(...dailyProfits.map(d => d.value), 50000);
        const padLeft = 14, padRight = 14, padTop = 18, padBottom = 26;
        const chartW = profitCanvas.width - padLeft - padRight;
        const chartH = profitCanvas.height - padTop - padBottom;
        const barSlot = chartW / days;
        const barW = Math.max(4, barSlot * 0.65);

        ctx.strokeStyle = '#E5E7EB';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padLeft, padTop + chartH);
        ctx.lineTo(padLeft + chartW, padTop + chartH);
        ctx.stroke();

        dailyProfits.forEach((d, idx) => {
          const barH = (d.value / maxVal) * chartH;
          const x = padLeft + idx * barSlot + (barSlot - barW) / 2;
          const y = padTop + chartH - barH;

          ctx.fillStyle = idx >= days - 3 ? '#16A34A' : '#86EFAC';
          ctx.beginPath();
          ctx.roundRect(x, y, barW, Math.max(3, barH), [4, 4, 0, 0]);
          ctx.fill();

          if (idx % 5 === 0 || idx === days - 1) {
            ctx.fillStyle = '#6B7280';
            ctx.font = '10px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(String(d.label), x + barW / 2, padTop + chartH + 15);
          }
        });
      }

      const stockCanvas = document.getElementById('stock-chart-canvas');
      if (stockCanvas) {
        const rect = stockCanvas.parentElement.getBoundingClientRect();
        stockCanvas.width = rect.width || 260;
        stockCanvas.height = rect.height || 170;
        const ctx = stockCanvas.getContext('2d');
        ctx.clearRect(0, 0, stockCanvas.width, stockCanvas.height);

        const total = DB.products.length || 1;
        const lowCount = DB.products.filter(p => p.stock_qty <= p.min_stock_alert).length;
        const safeCount = total - lowCount;

        const cx = stockCanvas.width / 2;
        const cy = stockCanvas.height / 2;
        const radius = Math.min(cx, cy) - 16;

        const safeAngle = (safeCount / total) * Math.PI * 2;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + safeAngle);
        ctx.lineWidth = 22;
        ctx.strokeStyle = '#16A34A';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, radius, -Math.PI / 2 + safeAngle, Math.PI * 1.5);
        ctx.lineWidth = 22;
        ctx.strokeStyle = '#DC2626';
        ctx.stroke();

        const safePct = Math.round((safeCount / total) * 100);
        ctx.fillStyle = '#111827';
        ctx.font = 'bold 18px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${safePct}%`, cx, cy - 6);
        ctx.fillStyle = '#6B7280';
        ctx.font = '11px Inter, sans-serif';
        ctx.fillText('Stok Aman', cx, cy + 12);
      }
    }

    function renderBuyerModule() {
      const warung = DB.merchant_settings;
      const categories = ['Semua', 'Sembako', 'Makanan Ringan', 'Minuman', 'Bumbu & Bumbu Dapur', 'Obat-obatan'];

      const myOrders = DB.transactions.filter(
        t => t.channel === 'ONLINE' || t.buyer_phone === appState.buyerPhone
      );
      const readyOrders = myOrders.filter(o => o.status === 'SIAP_DIAMBIL');

      const filteredProducts = DB.products.filter(p => {
        const matchCat = appState.buyerCategory === 'Semua' || p.category === appState.buyerCategory;
        const matchSearch = p.name.toLowerCase().includes(appState.buyerSearch.toLowerCase());
        return matchCat && matchSearch;
      });

      let buyerSubtotal = 0;
      const enrichedBuyerCart = appState.buyerCart.map((item, idx) => {
        const prod = DB.products.find(p => p.id === item.product_id);
        if (!prod) return null;
        const pricing = calculateLinePrice(prod, item.unit_name, item.conversion_qty, item.qty, 'Eceran', false);
        const lineTotal = pricing.unitPrice * item.qty;
        buyerSubtotal += lineTotal;
        return { ...item, idx, prod, pricing, lineTotal };
      }).filter(Boolean);

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 text-xs font-bold">🛒 Toko Online Warung</span>
                <span class="text-xs text-gray-500">Buka • Siap Antar & Ambil di Warung</span>
              </div>
              <h1 class="text-lg sm:text-xl font-extrabold text-gray-900 mt-1">${escapeHTML(warung.warung_name)}</h1>
              <p class="text-xs text-gray-500">${escapeHTML(warung.warung_address)} • WA Warung: ${escapeHTML(warung.warung_phone)}</p>
            </div>

            <div class="inline-flex rounded-xl bg-gray-100 p-1 border border-gray-200 self-start">
              <button onclick="appState.buyerTab='belanja'; renderApp();" class="px-3.5 py-2 rounded-lg text-xs font-bold transition ${appState.buyerTab === 'belanja' ? 'bg-emerald-600 text-white shadow-xs' : 'text-gray-700'}">
                🛍️ Katalog Belanja
              </button>
              <button onclick="appState.buyerTab='pesanan'; renderApp();" class="px-3.5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${appState.buyerTab === 'pesanan' ? 'bg-emerald-600 text-white shadow-xs' : 'text-gray-700'}">
                <span>🧾 Pesanan & Struk Saya</span>
                ${readyOrders.length > 0 ? `<span class="px-1.5 py-0.2 rounded-full bg-amber-400 text-gray-950 text-[10px] font-extrabold">${readyOrders.length}</span>` : ''}
              </button>
            </div>
          </div>

          ${readyOrders.map(ro => {
            const waConfirmUrl = `https://wa.me/${warung.warung_phone.replace(/^0/, '62')}?text=${encodeURIComponent(
              `Halo ${warung.warung_name}, pesanan saya (${ro.invoice_no}) yang sudah siap akan saya *${ro.delivery_method === 'DIANTAR' ? 'MINTA DIANTAR (+ Ongkir ' + formatRupiah(ro.delivery_fee) + ')' : 'AMBIL SENDIRI KE WARUNG'}*. Total ${formatRupiah(ro.total_amount)}. Terima kasih!`
            )}`;
            return `
              <div class="bg-amber-50 border-2 border-amber-400 rounded-2xl p-4 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
                <div class="flex items-start gap-3">
                  <div class="text-2xl">🔔</div>
                  <div>
                    <div class="text-xs font-extrabold uppercase text-amber-900">Notifikasi dari Pedagang • Pesanan Telah Disiapkan!</div>
                    <p class="text-xs sm:text-sm text-gray-800 mt-0.5">
                      Pesanan <strong>${escapeHTML(ro.invoice_no)}</strong> sudah selesai disiapkan! Ongkos kirim ditetapkan sebesar <strong>${formatRupiah(ro.delivery_fee)}</strong> (Total: <strong>${formatRupiah(ro.total_amount)}</strong>). Apakah akan diambil sendiri atau diantar?
                    </p>
                  </div>
                </div>
                <div class="flex flex-wrap gap-2 shrink-0">
                  <button onclick="confirmBuyerPickupChoice('${ro.id}', 'AMBIL_SENDIRI')" class="px-3 py-2 rounded-xl bg-white border border-amber-400 text-amber-950 text-xs font-bold hover:bg-amber-100">
                    🚶 Ambil Sendiri
                  </button>
                  <button onclick="confirmBuyerPickupChoice('${ro.id}', 'DIANTAR')" class="px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">
                    🛵 Antar (+${formatRupiah(ro.delivery_fee)})
                  </button>
                  <a href="${waConfirmUrl}" target="_blank" class="px-3 py-2 rounded-xl bg-gray-900 text-white text-xs font-bold">
                    📲 Konfirmasi WA
                  </a>
                </div>
              </div>
            `;
          }).join('')}

          ${appState.buyerTab === 'belanja' ? `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
              <div class="lg:col-span-8 space-y-3">
                <div class="bg-white rounded-2xl border border-gray-200 p-3.5 shadow-xs space-y-2.5">
                  <input
                    type="text"
                    value="${escapeHTML(appState.buyerSearch)}"
                    oninput="appState.buyerSearch=this.value; renderApp();"
                    placeholder="Cari beras, minyak goreng, mie instan, bumbu dapur, obat..."
                    class="w-full px-3.5 py-2.5 rounded-xl bg-gray-50 border border-gray-300 text-sm"
                  />
                  <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
                    ${categories.map(cat => `
                      <button onclick="appState.buyerCategory='${cat}'; renderApp();" class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${appState.buyerCategory === cat ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-700'}">
                        ${cat}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  ${filteredProducts.map(p => {
                    const isOut = p.stock_qty <= 0;
                    const tier = DB.product_price_tiers.find(t => t.product_id === p.id);
                    return `
                      <div class="bg-white rounded-2xl border border-gray-200 p-3.5 shadow-xs flex flex-col justify-between">
                        <div>
                          <div class="flex items-center justify-between gap-1 mb-1">
                            <span class="text-[10px] font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded">${escapeHTML(p.category)}</span>
                            <span class="text-[10px] font-bold ${isOut ? 'text-red-600' : 'text-emerald-700'}">
                              ${isOut ? 'Habis' : 'Tersedia: ' + p.stock_qty}
                            </span>
                          </div>
                          <h3 class="text-xs sm:text-sm font-bold text-gray-900 line-clamp-2">${escapeHTML(p.name)}</h3>
                          <div class="mt-2 text-sm font-extrabold text-emerald-700">
                            ${formatRupiah(p.base_sell_price)} <span class="text-[10px] font-normal text-gray-500">/${escapeHTML(p.base_unit)}</span>
                          </div>
                          ${tier ? `
                            <div class="mt-1 inline-block px-1.5 py-0.5 rounded bg-amber-100 text-amber-900 text-[10px] font-bold">
                              Beli ≥${tier.min_qty}: ${formatRupiah(tier.tier_price)}
                            </div>
                          ` : ''}
                        </div>

                        <button
                          ${isOut ? 'disabled' : `onclick="addToBuyerCart('${p.id}')"`}
                          class="mt-3 w-full py-2 rounded-xl text-xs font-bold transition ${isOut ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}"
                        >
                          ${isOut ? 'Stok Habis' : '+ Tambah ke Keranjang'}
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="lg:col-span-4 bg-white rounded-2xl border border-gray-200 p-4 shadow-sm space-y-3 sticky top-20">
                <h3 class="text-base font-extrabold text-gray-900 border-b border-gray-100 pb-2">Keranjang Belanja Anda</h3>

                <div class="max-h-52 overflow-y-auto divide-y divide-gray-100 bg-gray-50 rounded-xl p-2">
                  ${enrichedBuyerCart.length === 0 ? `
                    <p class="py-8 text-center text-xs text-gray-400">Keranjang belanja masih kosong.</p>
                  ` : enrichedBuyerCart.map(item => `
                    <div class="py-2 px-1 flex items-center justify-between gap-2 text-xs">
                      <div>
                        <div class="font-bold text-gray-900">${escapeHTML(item.prod.name)}</div>
                        <div class="text-emerald-700 font-semibold">${formatRupiah(item.pricing.unitPrice)} x ${item.qty} ${escapeHTML(item.unit_name)}</div>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <button onclick="updateBuyerCartQty(${item.idx}, -1)" class="w-6 h-6 rounded bg-white border border-gray-300 font-bold">-</button>
                        <span class="font-bold px-1">${item.qty}</span>
                        <button onclick="updateBuyerCartQty(${item.idx}, 1)" class="w-6 h-6 rounded bg-white border border-gray-300 font-bold">+</button>
                      </div>
                    </div>
                  `).join('')}
                </div>

                <div class="space-y-2 text-xs">
                  <div>
                    <label class="font-bold text-gray-700">Nama Pembeli *</label>
                    <input type="text" value="${escapeHTML(appState.buyerName)}" oninput="appState.buyerName=this.value" class="w-full mt-0.5 px-3 py-2 rounded-xl border border-gray-300" />
                  </div>
                  <div>
                    <label class="font-bold text-gray-700">No. WhatsApp Pembeli *</label>
                    <input type="tel" value="${escapeHTML(appState.buyerPhone)}" oninput="appState.buyerPhone=this.value" class="w-full mt-0.5 px-3 py-2 rounded-xl border border-gray-300" />
                  </div>
                  <div>
                    <label class="font-bold text-gray-700">Alamat Pengantaran</label>
                    <input type="text" value="${escapeHTML(appState.buyerAddress)}" oninput="appState.buyerAddress=this.value" class="w-full mt-0.5 px-3 py-2 rounded-xl border border-gray-300" />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="font-bold text-gray-700">Pengambilan</label>
                      <select onchange="appState.buyerDeliveryMethod=this.value" class="w-full mt-0.5 px-2.5 py-2 rounded-xl border border-gray-300 font-semibold">
                        <option value="DIANTAR" ${appState.buyerDeliveryMethod === 'DIANTAR' ? 'selected' : ''}>🛵 Diantar Warung</option>
                        <option value="AMBIL_SENDIRI" ${appState.buyerDeliveryMethod === 'AMBIL_SENDIRI' ? 'selected' : ''}>🚶 Ambil di Warung</option>
                      </select>
                    </div>
                    <div>
                      <label class="font-bold text-gray-700">Pembayaran</label>
                      <select onchange="appState.buyerPaymentPref=this.value" class="w-full mt-0.5 px-2.5 py-2 rounded-xl border border-gray-300 font-semibold">
                        <option value="TUNAI_COD" ${appState.buyerPaymentPref === 'TUNAI_COD' ? 'selected' : ''}>💵 Tunai / COD</option>
                        <option value="KASBON" ${appState.buyerPaymentPref === 'KASBON' ? 'selected' : ''}>📕 Catat Kasbon</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex items-center justify-between">
                  <span class="text-xs font-bold text-emerald-900">Subtotal Belanja</span>
                  <span class="text-lg font-extrabold text-emerald-700">${formatRupiah(buyerSubtotal)}</span>
                </div>

                <button onclick="submitBuyerOrder()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm shadow-sm">
                  🛒 Kirim Pesanan ke Warung
                </button>
              </div>
            </div>
          ` : `
            <div class="bg-white rounded-2xl border border-gray-200 p-4 sm:p-5 shadow-xs space-y-3">
              <h2 class="text-base font-extrabold text-gray-900">Riwayat Pesanan & Bukti Struk Belanja (Tunai & Kasbon)</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                ${myOrders.map(ord => `
                  <div class="p-4 rounded-2xl border border-gray-200 bg-gray-50/70 flex flex-col justify-between gap-3">
                    <div>
                      <div class="flex items-center justify-between">
                        <span class="font-mono text-xs font-extrabold text-gray-900">${escapeHTML(ord.invoice_no)}</span>
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${ord.status === 'SIAP_DIAMBIL' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'}">
                          ${escapeHTML(ord.status.replace('_', ' '))}
                        </span>
                      </div>
                      <div class="text-xs text-gray-500 mt-1">${formatDateID(ord.date)}</div>
                      <div class="mt-2 text-sm font-extrabold text-emerald-700">Total: ${formatRupiah(ord.total_amount)}</div>
                      ${ord.debt_amount > 0 ? `<div class="text-xs font-bold text-red-600">Status Kasbon: ${formatRupiah(ord.debt_amount)}</div>` : ''}
                    </div>
                    <button onclick="openReceiptModal('${ord.id}')" class="w-full py-2 rounded-xl bg-white border border-gray-300 hover:bg-gray-100 text-xs font-bold text-gray-800">
                      🧾 Buka Struk Lengkap & Bagikan WA
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
          `}
        </div>
      `;
    }

    function addToBuyerCart(productId) {
      const prod = DB.products.find(p => p.id === productId);
      if (!prod || prod.stock_qty <= 0) return;
      const idx = appState.buyerCart.findIndex(i => i.product_id === productId);
      if (idx >= 0) {
        if (appState.buyerCart[idx].qty + 1 > prod.stock_qty) {
          showToast('Melebihi stok tersedia di warung', 'warning');
          return;
        }
        appState.buyerCart[idx].qty += 1;
      } else {
        appState.buyerCart.push({
          product_id: productId,
          unit_name: prod.base_unit,
          conversion_qty: 1,
          qty: 1
        });
      }
      showToast(`${prod.name} masuk keranjang`, 'success');
      renderApp();
    }

    function updateBuyerCartQty(idx, delta) {
      const item = appState.buyerCart[idx];
      if (!item) return;
      const next = item.qty + delta;
      if (next <= 0) {
        appState.buyerCart.splice(idx, 1);
      } else {
        item.qty = next;
      }
      renderApp();
    }

    function submitBuyerOrder() {
      if (appState.buyerCart.length === 0) {
        showToast('Pilih barang belanjaan terlebih dahulu!', 'warning');
        return;
      }
      if (!appState.buyerName.trim() || !appState.buyerPhone.trim()) {
        showToast('Isi nama dan nomor WhatsApp Anda!', 'warning');
        return;
      }

      let subtotal = 0;
      const trxId = 'ORD-' + Date.now();
      const invoiceNo = 'ORD-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(DB.transactions.length + 1).padStart(2, '0');
      const nowISO = getTodayISO(0);

      for (const item of appState.buyerCart) {
        const prod = DB.products.find(p => p.id === item.product_id);
        const pricing = calculateLinePrice(prod, item.unit_name, item.conversion_qty, item.qty, 'Eceran', false);
        const lineSub = pricing.unitPrice * item.qty;
        subtotal += lineSub;

        DB.transaction_items.push({
          id: 'TI-' + Date.now() + Math.random().toString(36).slice(2, 5),
          transaction_id: trxId,
          product_id: prod.id,
          product_name: prod.name,
          unit_name: item.unit_name,
          conversion_qty: item.conversion_qty,
          qty: item.qty,
          unit_price: pricing.unitPrice,
          buy_price_snapshot: prod.base_buy_price,
          subtotal: lineSub
        });
      }

      const estOngkir = appState.buyerDeliveryMethod === 'DIANTAR' ? DB.merchant_settings.default_delivery_fee : 0;

      DB.transactions.unshift({
        id: trxId,
        invoice_no: invoiceNo,
        date: nowISO,
        channel: 'ONLINE',
        customer_id: 'C00',
        subtotal,
        delivery_fee: estOngkir,
        total_amount: subtotal + estOngkir,
        paid_amount: 0,
        debt_amount: appState.buyerPaymentPref === 'KASBON' ? subtotal + estOngkir : 0,
        status: 'MENUNGGU_SIAP',
        delivery_method: appState.buyerDeliveryMethod,
        buyer_name: appState.buyerName.trim(),
        buyer_phone: appState.buyerPhone.trim(),
        buyer_address: appState.buyerAddress.trim(),
        payment_preference: appState.buyerPaymentPref,
        notes: 'Pesanan Online Pembeli'
      });

      saveDB();
      appState.buyerCart = [];
      appState.buyerTab = 'pesanan';
      showToast(`Pesanan ${invoiceNo} berhasil dikirim ke warung!`, 'success');
      renderApp();
    }

    function confirmBuyerPickupChoice(orderId, choice) {
      const ord = DB.transactions.find(t => t.id === orderId);
      if (!ord) return;
      ord.delivery_method = choice;
      if (choice === 'AMBIL_SENDIRI') {
        ord.delivery_fee = 0;
        ord.total_amount = ord.subtotal;
      }
      saveDB();
      showToast(
        choice === 'AMBIL_SENDIRI'
          ? 'Konfirmasi Ambil Sendiri berhasil (Ongkir Rp 0).'
          : `Konfirmasi Diantar dengan ongkir ${formatRupiah(ord.delivery_fee)} berhasil.`,
        'success'
      );
      renderApp();
    }

    /*************************************************************************
     * 8. MAIN RENDER ORCHESTRATOR & INITIALIZATION
     *************************************************************************/
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (appState.activeRole === 'creator') {
        root.innerHTML = renderCreatorModule();
      } else if (appState.activeRole === 'buyer') {
        root.innerHTML = renderBuyerModule();
      } else {
        root.innerHTML = renderMerchantModule();
        if (appState.merchantLoggedInPhone && appState.merchantTab === 'laporan') {
          setTimeout(drawReportCharts, 30);
        }
      }
    }

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      if (['creator', 'merchant', 'buyer'].includes(hash)) {
        appState.activeRole = hash;
        updateHeaderRoleButtons();
        renderApp();
      }
    });

    window.addEventListener('resize', () => {
      if (appState.activeRole === 'merchant' && appState.merchantLoggedInPhone && appState.merchantTab === 'laporan') {
        drawReportCharts();
      }
    });

    window.onload = function () {
      loadDB();
      const initialHash = window.location.hash.replace('#', '').toLowerCase();
      if (['creator', 'merchant', 'buyer'].includes(initialHash)) {
        appState.activeRole = initialHash;
      }
      updateHeaderRoleButtons();
      renderApp();
    };
  </script>
</body>
</html>
